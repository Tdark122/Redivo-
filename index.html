<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redivo — Data, subscriptions, everything else</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F111A;
    --bg-soft:#161927;
    --card:#1B1F30;
    --line:#2A2F45;
    --text:#F2F2F6;
    --muted:#8A8FA3;
    --violet:#7C5CFF;
    --violet-dim:#5C43C4;
    --amber:#FFB020;
    --green:#3DDC84;
    --radius:16px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(124,92,255,0.16), transparent 45%),
      radial-gradient(circle at 85% 20%, rgba(255,176,32,0.08), transparent 40%),
      var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px;}

  /* signal-bar signature motif */
  .bars{display:inline-flex; align-items:flex-end; gap:3px; height:14px;}
  .bars span{width:3px; display:block; background:var(--violet); border-radius:2px;}
  .bars span:nth-child(1){height:35%;}
  .bars span:nth-child(2){height:60%;}
  .bars span:nth-child(3){height:85%;}
  .bars span:nth-child(4){height:100%; background:var(--amber);}

  header{
    position:sticky; top:0; z-index:20;
    backdrop-filter:blur(14px);
    background:rgba(15,17,26,0.75);
    border-bottom:1px solid var(--line);
  }
  .nav{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; max-width:1080px; margin:0 auto;}
  .brand{display:flex; align-items:center; gap:10px; font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:20px; letter-spacing:-0.02em;}
  .status-pill{
    display:flex; align-items:center; gap:8px;
    font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--muted);
    border:1px solid var(--line); padding:6px 12px; border-radius:999px;
  }
  .status-dot{width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 8px var(--green);}

  .hero{padding:64px 20px 40px; text-align:center;}
  .eyebrow{
    font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--amber);
    letter-spacing:0.08em; text-transform:uppercase; margin-bottom:16px;
    display:inline-flex; align-items:center; gap:8px;
  }
  h1{
    font-family:'Space Grotesk', sans-serif; font-weight:700;
    font-size:clamp(32px, 6vw, 56px); letter-spacing:-0.03em; line-height:1.05;
    max-width:720px; margin:0 auto 18px;
  }
  h1 .accent{color:var(--violet);}
  .sub{color:var(--muted); font-size:16px; max-width:520px; margin:0 auto; line-height:1.6;}

  .cat-tabs{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:36px 0 8px;}
  .cat-tab{
    font-family:'Space Grotesk', sans-serif; font-size:14px; font-weight:600;
    padding:9px 18px; border-radius:999px; border:1px solid var(--line);
    color:var(--muted); cursor:pointer; background:transparent; transition:all .18s ease;
  }
  .cat-tab.active{background:var(--violet); border-color:var(--violet); color:#fff;}
  .cat-tab:hover{border-color:var(--violet);}

  main{padding:24px 20px 100px;}
  .section-title{
    font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:18px;
    margin:36px 0 16px; display:flex; align-items:center; gap:10px; color:var(--text);
  }
  .section-title .bars{transform:scale(0.9);}

  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:14px;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px; display:flex; flex-direction:column; gap:10px;
    transition:transform .18s ease, border-color .18s ease;
  }
  .card:hover{transform:translateY(-3px); border-color:var(--violet-dim);}
  .card-name{font-weight:600; font-size:15.5px; line-height:1.35;}
  .card-desc{color:var(--muted); font-size:13px; line-height:1.5; flex:1;}
  .card-price{
    font-family:'JetBrains Mono', monospace; font-weight:700; font-size:20px; color:var(--amber);
    letter-spacing:-0.02em;
  }
  .buy-btn{
    margin-top:6px; width:100%; padding:11px; border-radius:10px; border:none;
    background:var(--violet); color:#fff; font-weight:600; font-size:14px;
    font-family:'Inter', sans-serif; cursor:pointer; transition:background .15s ease;
  }
  .buy-btn:hover{background:#6a4ce8;}
  .buy-btn:active{transform:scale(0.98);}

  .empty, .loading{color:var(--muted); text-align:center; padding:40px 0; font-size:14px;}

  /* modal */
  .overlay{
    position:fixed; inset:0; background:rgba(10,11,18,0.7); backdrop-filter:blur(4px);
    display:none; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--bg-soft); border:1px solid var(--line); border-radius:20px;
    padding:26px; width:100%; max-width:380px;
  }
  .modal h3{font-family:'Space Grotesk', sans-serif; font-size:19px; margin-bottom:4px;}
  .modal .modal-sub{color:var(--muted); font-size:13px; margin-bottom:20px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:6px; font-family:'JetBrains Mono', monospace;}
  .field select, .field input{
    width:100%; padding:12px 13px; border-radius:10px; border:1px solid var(--line);
    background:var(--bg); color:var(--text); font-size:14px; font-family:'Inter', sans-serif;
  }
  .field select:focus, .field input:focus{outline:none; border-color:var(--violet);}
  .modal-actions{display:flex; gap:10px; margin-top:20px;}
  .modal-actions button{flex:1; padding:12px; border-radius:10px; border:none; font-weight:600; font-size:14px; cursor:pointer;}
  .btn-cancel{background:transparent; border:1px solid var(--line) !important; color:var(--muted);}
  .btn-confirm{background:var(--green); color:#0F111A;}

  footer{border-top:1px solid var(--line); padding:26px 20px; text-align:center; color:var(--muted); font-size:12.5px;}
  footer a{color:var(--violet);}

  @media (prefers-reduced-motion: reduce){ .card, .buy-btn{transition:none;} }
</style>
</head>
<body>

<header>
  <div class="nav">
    <div class="brand"><span class="bars"><span></span><span></span><span></span><span></span></span>Redivo</div>
    <div class="status-pill"><span class="status-dot"></span>orders via WhatsApp</div>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <div class="eyebrow"><span class="bars"><span></span><span></span><span></span><span></span></span> always connected</div>
    <h1>Data, subscriptions, <span class="accent">anything</span> — sorted in one chat.</h1>
    <p class="sub">Pick what you need, drop your details, and it lands straight in WhatsApp. No accounts, no waiting.</p>

    <div class="cat-tabs" id="catTabs"></div>
  </div>
</section>

<main class="wrap">
  <div id="content"><div class="loading">Loading products…</div></div>
</main>

<footer>
  Redivo · orders are handled directly on <a href="https://wa.me/2347037392295" target="_blank">WhatsApp</a>
</footer>

<!-- Data purchase modal -->
<div class="overlay" id="dataOverlay">
  <div class="modal">
    <h3 id="dataModalTitle">Buy data</h3>
    <p class="modal-sub" id="dataModalPrice"></p>
    <div class="field">
      <label>Network</label>
      <select id="networkSelect">
        <option value="MTN">MTN</option>
        <option value="Airtel">Airtel</option>
        <option value="Glo">Glo</option>
        <option value="9mobile">9mobile</option>
      </select>
    </div>
    <div class="field">
      <label>Phone number</label>
      <input type="tel" id="phoneInput" placeholder="080XXXXXXXX" maxlength="11">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeDataModal()">Cancel</button>
      <button class="btn-confirm" onclick="confirmDataOrder()">Continue to WhatsApp</button>
    </div>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
  // ── Replace with your own Firebase project config ──
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const WHATSAPP_NUMBER = "2347037392295"; // 07037392295 in international format

  let allProducts = [];
  let activeCategory = "all";
  let pendingDataProduct = null;

  function money(n){
    return "₦" + Number(n).toLocaleString();
  }

  function waLink(message){
    return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
  }

  function renderTabs(categories){
    const tabs = document.getElementById('catTabs');
    tabs.innerHTML = '';
    const cats = ["all", ...categories];
    cats.forEach(cat => {
      const btn = document.createElement('button');
      btn.className = 'cat-tab' + (cat === activeCategory ? ' active' : '');
      btn.textContent = cat === 'all' ? 'All' : cat;
      btn.onclick = () => { activeCategory = cat; render(); };
      tabs.appendChild(btn);
    });
  }

  function render(){
    const categories = [...new Set(allProducts.map(p => p.category))];
    renderTabs(categories);

    const content = document.getElementById('content');
    const visible = allProducts.filter(p => activeCategory === 'all' || p.category === activeCategory);

    if(visible.length === 0){
      content.innerHTML = '<div class="empty">Nothing here yet — check back soon.</div>';
      return;
    }

    if(activeCategory !== 'all'){
      content.innerHTML = `<div class="grid">${visible.map(cardHTML).join('')}</div>`;
      return;
    }

    // grouped by category when viewing "All"
    let html = '';
    categories.forEach(cat => {
      const items = allProducts.filter(p => p.category === cat);
      if(items.length === 0) return;
      html += `<div class="section-title"><span class="bars"><span></span><span></span><span></span><span></span></span>${cat}</div>`;
      html += `<div class="grid">${items.map(cardHTML).join('')}</div>`;
    });
    content.innerHTML = html;
  }

  function cardHTML(p){
    const isData = p.category && p.category.toLowerCase() === 'data';
    return `
      <div class="card">
        <div class="card-name">${escapeHTML(p.name)}</div>
        ${p.description ? `<div class="card-desc">${escapeHTML(p.description)}</div>` : '<div class="card-desc"></div>'}
        <div class="card-price">${money(p.price)}</div>
        <button class="buy-btn" onclick='handleBuy(${JSON.stringify(p).replace(/'/g, "&#39;")})'>Buy now</button>
      </div>
    `;
  }

  function escapeHTML(str){
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }

  function handleBuy(product){
    const isData = product.category && product.category.toLowerCase() === 'data';
    if(isData){
      pendingDataProduct = product;
      document.getElementById('dataModalTitle').textContent = product.name;
      document.getElementById('dataModalPrice').textContent = money(product.price);
      document.getElementById('phoneInput').value = '';
      document.getElementById('dataOverlay').classList.add('show');
    } else {
      const msg = `Hi Redivo, I'd like to buy:\n\n${product.name}\nPrice: ${money(product.price)}`;
      window.open(waLink(msg), '_blank');
    }
  }

  function closeDataModal(){
    document.getElementById('dataOverlay').classList.remove('show');
    pendingDataProduct = null;
  }

  function confirmDataOrder(){
    const network = document.getElementById('networkSelect').value;
    const phone = document.getElementById('phoneInput').value.trim();
    if(!/^0\d{10}$/.test(phone)){
      alert('Enter a valid 11-digit phone number, e.g. 08012345678');
      return;
    }
    const msg = `Hi Redivo, I'd like to buy data:\n\nPlan: ${pendingDataProduct.name}\nPrice: ${money(pendingDataProduct.price)}\nNetwork: ${network}\nPhone: ${phone}`;
    window.open(waLink(msg), '_blank');
    closeDataModal();
  }

  document.getElementById('dataOverlay').addEventListener('click', (e) => {
    if(e.target.id === 'dataOverlay') closeDataModal();
  });

  // ── Load products from Firestore, live ──
  db.collection('products').orderBy('name').onSnapshot(snap => {
    allProducts = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    render();
  }, err => {
    document.getElementById('content').innerHTML =
      `<div class="empty">Couldn't load products. Check your Firebase config in index.html.<br>${err.message}</div>`;
  });
</script>
</body>
</html>
