<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redivo — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F111A; --bg-soft:#161927; --card:#1B1F30; --line:#2A2F45;
    --text:#F2F2F6; --muted:#8A8FA3; --violet:#7C5CFF; --amber:#FFB020;
    --green:#3DDC84; --red:#FF5C5C; --radius:16px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); font-family:'Inter', sans-serif; min-height:100vh;}
  .wrap{max-width:760px; margin:0 auto; padding:40px 20px 80px;}
  h1{font-family:'Space Grotesk', sans-serif; font-size:24px; letter-spacing:-0.02em; margin-bottom:4px;}
  .sub{color:var(--muted); font-size:13.5px; margin-bottom:28px;}
  .bars{display:inline-flex; align-items:flex-end; gap:3px; height:14px; margin-right:8px;}
  .bars span{width:3px; display:block; background:var(--violet); border-radius:2px;}
  .bars span:nth-child(1){height:35%;} .bars span:nth-child(2){height:60%;}
  .bars span:nth-child(3){height:85%;} .bars span:nth-child(4){height:100%; background:var(--amber);}

  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:22px; margin-bottom:20px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:6px; font-family:'JetBrains Mono', monospace;}
  .field input, .field select, .field textarea{
    width:100%; padding:12px 13px; border-radius:10px; border:1px solid var(--line);
    background:var(--bg); color:var(--text); font-size:14px; font-family:'Inter', sans-serif;
  }
  .field textarea{resize:vertical; min-height:60px;}
  .field select:focus, .field input:focus, .field textarea:focus{outline:none; border-color:var(--violet);}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}

  button{
    font-family:'Inter', sans-serif; font-weight:600; font-size:14px; cursor:pointer;
    border:none; border-radius:10px; padding:12px 18px;
  }
  .btn-primary{background:var(--violet); color:#fff; width:100%;}
  .btn-primary:hover{background:#6a4ce8;}
  .btn-danger{background:transparent; border:1px solid var(--red); color:var(--red); padding:8px 14px; font-size:12.5px;}
  .btn-danger:hover{background:rgba(255,92,92,0.1);}
  .btn-logout{background:transparent; border:1px solid var(--line); color:var(--muted); padding:8px 14px; font-size:12.5px;}

  .top{display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;}
  .list-item{
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    padding:14px 0; border-bottom:1px solid var(--line);
  }
  .list-item:last-child{border-bottom:none;}
  .li-name{font-weight:600; font-size:14.5px;}
  .li-meta{color:var(--muted); font-size:12.5px; font-family:'JetBrains Mono', monospace; margin-top:2px;}
  .li-price{font-family:'JetBrains Mono', monospace; font-weight:700; color:var(--amber); margin-right:10px;}

  #loginScreen{max-width:340px; margin:80px auto 0; text-align:center;}
  #loginScreen .card{text-align:left;}
  .msg{font-size:13px; margin-top:10px; text-align:center;}
  .msg.error{color:var(--red);}
  .msg.success{color:var(--green);}
  #appScreen{display:none;}
</style>
</head>
<body>

<div id="loginScreen">
  <h1 style="text-align:center"><span class="bars"><span></span><span></span><span></span><span></span></span>Redivo Admin</h1>
  <p class="sub" style="text-align:center">Sign in to manage products</p>
  <div class="card">
    <div class="field">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="you@redivo.com">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••">
    </div>
    <button class="btn-primary" onclick="login()">Sign in</button>
    <div class="msg error" id="loginMsg"></div>
  </div>
</div>

<div id="appScreen">
  <div class="wrap">
    <div class="top">
      <div>
        <h1><span class="bars"><span></span><span></span><span></span><span></span></span>Redivo Admin</h1>
        <p class="sub" style="margin-bottom:0" id="userEmail"></p>
      </div>
      <button class="btn-logout" onclick="logout()">Sign out</button>
    </div>

    <div class="card">
      <div class="field">
        <label>Product name</label>
        <input type="text" id="pName" placeholder="e.g. 5GB MTN Monthly, Netflix Premium 1 month">
      </div>
      <div class="row2">
        <div class="field">
          <label>Type</label>
          <select id="pType" onchange="onTypeChange()">
            <option value="data">Data (asks buyer for network + phone)</option>
            <option value="other">Other (straight to WhatsApp)</option>
          </select>
        </div>
        <div class="field">
          <label>Price (₦)</label>
          <input type="number" id="pPrice" placeholder="1500">
        </div>
      </div>
      <div class="row2">
        <div class="field" id="categoryDataWrap">
          <label>Network</label>
          <select id="pCategoryData">
            <option value="MTN">MTN</option>
            <option value="Airtel">Airtel</option>
            <option value="Glo">Glo</option>
            <option value="9mobile">9mobile</option>
          </select>
        </div>
        <div class="field" id="categoryOtherWrap" style="display:none">
          <label>Category</label>
          <input type="text" id="pCategoryOther" placeholder="Subscriptions / Gift Cards / Other" list="catList">
          <datalist id="catList"></datalist>
        </div>
      </div>
      <div class="field">
        <label>Description (optional)</label>
        <textarea id="pDesc" placeholder="Short note shown on the product card"></textarea>
      </div>
      <button class="btn-primary" onclick="addProduct()">Add product</button>
      <div class="msg" id="addMsg"></div>
    </div>

    <div class="card">
      <div style="font-family:'Space Grotesk', sans-serif; font-weight:600; margin-bottom:10px;">Live catalog</div>
      <div class="field">
        <input type="text" id="adminSearch" placeholder="Search catalog…" oninput="renderProductList()">
      </div>
      <div id="productList"><p class="sub">Loading…</p></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
  // ── Use the SAME config as index.html ──
  const firebaseConfig = {
    apiKey: "AIzaSyBG4qRzSetbjZSJ_jL55276W0FzPgjMH-U",
    authDomain: "redivo-b7fc3.firebaseapp.com",
    projectId: "redivo-b7fc3",
    storageBucket: "redivo-b7fc3.firebasestorage.app",
    messagingSenderId: "962346026524",
    appId: "1:962346026524:web:241a3f1fab6493be9941d9"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  auth.onAuthStateChanged(user => {
    if(user){
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('appScreen').style.display = 'block';
      document.getElementById('userEmail').textContent = user.email;
      listenProducts();
    } else {
      document.getElementById('loginScreen').style.display = 'block';
      document.getElementById('appScreen').style.display = 'none';
    }
  });

  function login(){
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const msg = document.getElementById('loginMsg');
    msg.textContent = '';
    auth.signInWithEmailAndPassword(email, password)
      .catch(err => { msg.textContent = err.message; });
  }

  function logout(){ auth.signOut(); }

  function money(n){ return "₦" + Number(n).toLocaleString(); }

  function onTypeChange(){
    const type = document.getElementById('pType').value;
    document.getElementById('categoryDataWrap').style.display = type === 'data' ? 'block' : 'none';
    document.getElementById('categoryOtherWrap').style.display = type === 'data' ? 'none' : 'block';
  }

  function addProduct(){
    const name = document.getElementById('pName').value.trim();
    const type = document.getElementById('pType').value;
    const category = type === 'data'
      ? document.getElementById('pCategoryData').value
      : document.getElementById('pCategoryOther').value.trim();
    const price = parseFloat(document.getElementById('pPrice').value);
    const description = document.getElementById('pDesc').value.trim();
    const addMsg = document.getElementById('addMsg');

    if(!name || !category || isNaN(price)){
      addMsg.className = 'msg error';
      addMsg.textContent = 'Fill in name, category and a valid price.';
      return;
    }

    db.collection('products').add({
      name, category, type, price, description,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(() => {
      addMsg.className = 'msg success';
      addMsg.textContent = 'Product added.';
      document.getElementById('pName').value = '';
      document.getElementById('pCategoryOther').value = '';
      document.getElementById('pPrice').value = '';
      document.getElementById('pDesc').value = '';
    }).catch(err => {
      addMsg.className = 'msg error';
      addMsg.textContent = err.message;
    });
  }

  function deleteProduct(id){
    if(!confirm('Delete this product?')) return;
    db.collection('products').doc(id).delete();
  }

  let currentProducts = [];

  function listenProducts(){
    db.collection('products').orderBy('name').onSnapshot(snap => {
      currentProducts = snap.docs.map(d => ({ id: d.id, ...d.data() }));

      // update category autocomplete
      const cats = [...new Set(currentProducts.map(p => p.category))];
      document.getElementById('catList').innerHTML = cats.map(c => `<option value="${c}">`).join('');

      renderProductList();
    });
  }

  function renderProductList(){
    const list = document.getElementById('productList');
    const term = document.getElementById('adminSearch').value.trim().toLowerCase();
    const products = currentProducts.filter(p =>
      !term || `${p.name} ${p.category}`.toLowerCase().includes(term)
    );

    if(currentProducts.length === 0){
      list.innerHTML = '<p class="sub">No products yet — add your first one above.</p>';
      return;
    }
    if(products.length === 0){
      list.innerHTML = `<p class="sub">No matches for "${escapeHTML(term)}".</p>`;
      return;
    }
    list.innerHTML = products.map(p => `
      <div class="list-item">
        <div>
          <div class="li-name">${escapeHTML(p.name)}</div>
          <div class="li-meta">${escapeHTML(p.category)}</div>
        </div>
        <div style="display:flex; align-items:center;">
          <span class="li-price">${money(p.price)}</span>
          <button class="btn-danger" onclick="deleteProduct('${p.id}')">Delete</button>
        </div>
      </div>
    `).join('');
  }

  function escapeHTML(str){
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }
</script>
</body>
</html>
